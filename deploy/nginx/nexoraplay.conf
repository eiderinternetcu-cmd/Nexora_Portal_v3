    location ^~ /stream/co-main/ {
        set $stream_orig_uri $request_uri;
        set $stream_token $arg_token;
        auth_request /__stream_auth;
        error_page 401 = @stream_denied;
        error_page 403 = @stream_denied;
        access_log /dev/stdout stream_safe;

        proxy_pass http://38.210.187.13:8002/;           # Colombia
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        # ── P1.6 · caché de segmentos HLS ────────────────────────────────────
        # Expandido de snippets/stream-cache.conf. LA FUENTE DE VERDAD ES ESE
        # ARCHIVO: allí está el razonamiento completo de cada directiva; aquí se
        # conserva solo lo que no se puede perder sin invitar a un "arreglo" que
        # rompa algo. Si tocas una copia, tócalas las OCHO (4 nodos × 2 vhosts).
        #
        # NO DEBILITA EL GATE: auth_request se resuelve en la fase ACCESS y la
        # caché en la fase CONTENT; ACCESS va siempre primero, así que el
        # subrequest a FastAPI corre en TODAS las peticiones, acierten o no.
        proxy_cache hls_cache;

        # LA CLAVE NO LLEVA EL TOKEN. El default de nginx es
        # $scheme$proxy_host$request_uri y $request_uri INCLUYE la query: con él,
        # el ?token= de cada espectador crearía su propia entrada y el acierto
        # sería 0 %. $uri es el path SIN query: identifica el RECURSO, no a quién
        # lo pide. Sin $host a propósito: las dos marcas piden los mismos bytes
        # al mismo origen y comparten entrada.
        proxy_cache_key $proxy_host$uri;

        # El manifiesto es mutable (se reescribe cada hls_time=4 s): TTL cero.
        # Hacen falta las dos directivas: bypass no lee, no_cache no escribe.
        proxy_cache_bypass $stream_is_manifest;
        proxy_no_cache     $stream_is_manifest;

        # 30 s = ventana de directo del origen (hls_time 4 × hls_list_size 6 =
        # 24 s) + margen. Más no sirve: delete_segments los borra a los ~28 s.
        proxy_cache_valid 200 30s;
        proxy_cache_valid 404 1s;

        # Cumple el AC "N espectadores → 1 conexión al origen": sin el lock, N
        # peticiones simultáneas de un segmento frío son N tiradas al origen.
        proxy_cache_lock on;
        proxy_cache_lock_age 5s;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale updating;

        # Sin esto la caché no guarda NADA: los orígenes marcan los segmentos
        # con Cache-Control: no-cache. Set-Cookie NO se ignora a propósito.
        proxy_ignore_headers Cache-Control Expires X-Accel-Expires Vary;

        # proxy_cache no puede almacenar lo que no bufferiza: esta línea sustituye
        # al antiguo `proxy_buffering off` (declararlo dos veces = no arranca).
        proxy_buffering on;
        proxy_buffers 32 32k;
        proxy_busy_buffers_size 64k;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    # Canales transcodificados. A diferencia de ec-main/co-main, el origen NO es un
    # Flussonic/Astra externo sino nuestros propios contenedores ffmpeg (ver
    # docker-compose.transcode.production.yml y docs/PRUEBA_TRANSCODIFICACION.md).
    # Mismo gate: el manifiesto exige ?token= y los segmentos pasan por el grant.
    #
    # ⚠ DEPENDENCIA DE ARRANQUE: `nexora_hls` es un nombre de contenedor y nginx
    #   resuelve los upstream de proxy_pass al CARGAR la configuración, no por
    #   petición. Si el stack de transcodificación está parado, nginx no arranca
    #   ("host not found in upstream") y caen TODOS los dominios, no solo tc-main.
    #   Esto ya era así en el conf monolítico de producción; al factorizarlo se
    #   hereda igual. Para desacoplarlo haría falta `resolver` + proxy_pass con
    #   variable, pero eso cambia el tratamiento del URI (la variable NO aplica el
    #   recorte del prefijo que hace el `/` final) y exige un rewrite explícito.
    #   No se toca aquí: es una ruta viva y merece su propia ventana.
    location ^~ /stream/tc-main/ {
        set $stream_orig_uri $request_uri;
        set $stream_token $arg_token;
        auth_request /__stream_auth;
        error_page 401 = @stream_denied;
        error_page 403 = @stream_denied;
        access_log /dev/stdout stream_safe;

        proxy_pass http://nexora_hls:80/;                # contenedor sin puertos publicados
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        # ── P1.6 · caché de segmentos HLS ────────────────────────────────────
        # Expandido de snippets/stream-cache.conf. LA FUENTE DE VERDAD ES ESE
        # ARCHIVO: allí está el razonamiento completo de cada directiva; aquí se
        # conserva solo lo que no se puede perder sin invitar a un "arreglo" que
        # rompa algo. Si tocas una copia, tócalas las OCHO (4 nodos × 2 vhosts).
        #
        # NO DEBILITA EL GATE: auth_request se resuelve en la fase ACCESS y la
        # caché en la fase CONTENT; ACCESS va siempre primero, así que el
        # subrequest a FastAPI corre en TODAS las peticiones, acierten o no.
        proxy_cache hls_cache;

        # LA CLAVE NO LLEVA EL TOKEN. El default de nginx es
        # $scheme$proxy_host$request_uri y $request_uri INCLUYE la query: con él,
        # el ?token= de cada espectador crearía su propia entrada y el acierto
        # sería 0 %. $uri es el path SIN query: identifica el RECURSO, no a quién
        # lo pide. Sin $host a propósito: las dos marcas piden los mismos bytes
        # al mismo origen y comparten entrada.
        proxy_cache_key $proxy_host$uri;

        # El manifiesto es mutable (se reescribe cada hls_time=4 s): TTL cero.
        # Hacen falta las dos directivas: bypass no lee, no_cache no escribe.
        proxy_cache_bypass $stream_is_manifest;
        proxy_no_cache     $stream_is_manifest;

        # 30 s = ventana de directo del origen (hls_time 4 × hls_list_size 6 =
        # 24 s) + margen. Más no sirve: delete_segments los borra a los ~28 s.
        proxy_cache_valid 200 30s;
        proxy_cache_valid 404 1s;

        # Cumple el AC "N espectadores → 1 conexión al origen": sin el lock, N
        # peticiones simultáneas de un segmento frío son N tiradas al origen.
        proxy_cache_lock on;
        proxy_cache_lock_age 5s;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale updating;

        # Sin esto la caché no guarda NADA: los orígenes marcan los segmentos
        # con Cache-Control: no-cache. Set-Cookie NO se ignora a propósito.
        proxy_ignore_headers Cache-Control Expires X-Accel-Expires Vary;

        # proxy_cache no puede almacenar lo que no bufferiza: esta línea sustituye
        # al antiguo `proxy_buffering off` (declararlo dos veces = no arranca).
        proxy_buffering on;
        proxy_buffers 32 32k;
        proxy_busy_buffers_size 64k;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    # Torre de transcodificacion de Miami (66.163.125.89). Mismo gate, pero el origen
    # esta al otro lado de internet y no en la red Docker: de ahi los timeouts
    # explicitos. Su 8088 esta cerrado por firewall a todo salvo la IP de este edge.
    #
    # A diferencia de tc-main, aqui el upstream es una IP literal, asi que NO crea
    # dependencia de arranque: nginx levanta aunque la torre este apagada.
    location ^~ /stream/tc-mia/ {
        set $stream_orig_uri $request_uri;
        set $stream_token $arg_token;
        auth_request /__stream_auth;
        error_page 401 = @stream_denied;
        error_page 403 = @stream_denied;
        access_log /dev/stdout stream_safe;

        proxy_pass http://66.163.125.89:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        # ── P1.6 · caché de segmentos HLS (misma copia que los otros nodos) ──
        # Fuente de verdad: snippets/stream-cache.conf. Si tocas una copia,
        # tócalas las OCHO (4 nodos × 2 vhosts).
        #
        # NO DEBILITA EL GATE: auth_request se resuelve en la fase ACCESS y la
        # caché en la fase CONTENT; ACCESS va siempre primero, así que el
        # subrequest a FastAPI corre en TODAS las peticiones, acierten o no.
        proxy_cache hls_cache;

        # LA CLAVE NO LLEVA EL TOKEN. El default de nginx es
        # $scheme$proxy_host$request_uri y $request_uri INCLUYE la query: con él,
        # el ?token= de cada espectador crearía su propia entrada y el acierto
        # sería 0 %. $uri es el path SIN query: identifica el RECURSO, no a quién
        # lo pide. Sin $host a propósito: las dos marcas piden los mismos bytes
        # al mismo origen y comparten entrada.
        proxy_cache_key $proxy_host$uri;

        # El manifiesto es mutable (se reescribe cada hls_time=4 s): TTL cero.
        # Hacen falta las dos directivas: bypass no lee, no_cache no escribe.
        proxy_cache_bypass $stream_is_manifest;
        proxy_no_cache     $stream_is_manifest;

        # 30 s = ventana de directo del origen (hls_time 4 × hls_list_size 6 =
        # 24 s) + margen. Más no sirve: delete_segments los borra a los ~28 s.
        proxy_cache_valid 200 30s;
        proxy_cache_valid 404 1s;

        # Cumple el AC "N espectadores → 1 conexión al origen": sin el lock, N
        # peticiones simultáneas de un segmento frío son N tiradas al origen.
        proxy_cache_lock on;
        proxy_cache_lock_age 5s;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale updating;

        # Sin esto la caché no guarda NADA: los orígenes marcan los segmentos
        # con Cache-Control: no-cache. Set-Cookie NO se ignora a propósito.
        proxy_ignore_headers Cache-Control Expires X-Accel-Expires Vary;

        # proxy_cache no puede almacenar lo que no bufferiza: esta línea sustituye
        # al antiguo `proxy_buffering off` (declararlo dos veces = no arranca).
        proxy_buffering on;
        proxy_buffers 32 32k;
        proxy_busy_buffers_size 64k;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout;
        proxy_redirect off;
    }

    location @stream_denied {
        access_log /dev/stdout stream_safe;
        default_type application/json;
        return 401 '{"success":false,"error":"playback token required or invalid"}';
    }
    # ── /docs, /redoc, /openapi.json ────────────────────────────────────────────
    # DEUDA CONOCIDA, conservada a proposito para que este despliegue sea
    # puramente aditivo: hoy ya estan publicos y sin auth en este dominio, y
    # quitarlos es el unico cambio que ROMPERIA algo existente (cualquier
    # herramienta o partner que consuma el esquema). Se retira en un cambio
    # propio, tras comprobar en los access logs que nadie los usa.
    #
    # Por que hay que retirarlos: el esquema publica el mapa completo de la API,
    # incluido /internal/stream-auth/validate y su contrato de parametros — el
    # mapa exacto que necesita quien quiera atacar la autorizacion de playback.
    # El arreglo real no es nginx sino docs_url=None / redoc_url=None cuando
    # APP_ENV=production (app/main.py:102-103): nginx solo los esconde de
    # Internet, siguen expuestos a cualquiera dentro de la red Docker.
    #
    # NO se replican en los vhosts de marca nueva: laredtelco.conf nace sin ellos.
    location ^~ /docs {
        proxy_pass http://nexora_api:8000;
    }

    location ^~ /redoc {
        proxy_pass http://nexora_api:8000;
    }

    location = /openapi.json {
        proxy_pass http://nexora_api:8000/openapi.json;
    }
}


# ═══ desde conf.d/laredtelco.conf ═══

# ─────────────────────────────────────────────────────────────────────────────
#  vhost: tvdigital.laredtelco.com (marca La Red)
#
#  Requisito previo: el certificado TIENE que existir antes de cargar este
#  archivo — nginx no arranca si ssl_certificate apunta a una ruta inexistente.
#      sudo certbot certonly --webroot -w /var/www/certbot -d tvdigital.laredtelco.com
#  Mientras el certificado no exista, el reto HTTP-01 lo responde el catch-all
#  de 00-default-server.conf. Ver README.md.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name tvdigital.laredtelco.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen 443 ssl http2;` está deprecado desde nginx 1.25 (imagen: 1.27).
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tvdigital.laredtelco.com;

    ssl_certificate         /etc/letsencrypt/live/tvdigital.laredtelco.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/tvdigital.laredtelco.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/tvdigital.laredtelco.com/chain.pem;
    # ── inline: snippets/tls-common.conf ──
    # Parámetros TLS comunes a todos los vhosts HTTPS.
    # Se incluye DENTRO de server{}, después de los ssl_certificate/ssl_certificate_key
    # (que son por dominio y viven en el vhost).
    #
    # NOTA: `listen 443 ssl http2;` está DEPRECADO desde nginx 1.25 (la imagen es
    # 1.27). La forma correcta es `listen 443 ssl;` + `http2 on;` en el server{}.
    # `http2 on` no se pone aquí a propósito: es una directiva de server, no de TLS,
    # y se declara junto al listen para que se lea al lado de lo que afecta.

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    client_max_body_size 20m;

    # ── inline: snippets/security-headers.conf ──

    # Cabeceras de seguridad comunes a todos los vhosts HTTPS.

    #

    # HSTS (Strict-Transport-Security) NO está aquí: su max-age depende de la

    # MADUREZ de cada dominio (un dominio recién dado de alta debe arrancar con un

    # max-age corto para poder revertir sin dejar a los clientes clavados en HTTPS

    # durante un año). Se declara en cada vhost. Ver README.md, "Escalera de HSTS".

    #

    # ⚠ nginx NO fusiona `add_header` entre niveles: si una location{} declara su

    #   propio add_header, TODOS estos desaparecen para esa location. Si añades

    #   add_header en alguna location, replica también estos.


    add_header X-Frame-Options        "SAMEORIGIN"                    always;

    add_header X-Content-Type-Options "nosniff"                       always;

    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # ── HSTS: DOMINIO NUEVO, ARRANCA CORTO ───────────────────────────────────
    # max-age=300 (5 min), no un año. HSTS es IRREVERSIBLE del lado del cliente
    # durante todo el max-age: si el certificado falla o hay que volver a HTTP
    # para diagnosticar, cada navegador que ya visitó el sitio queda clavado en
    # HTTPS y no hay forma de arreglarlo desde el servidor. Con 300 s el radio
    # de daño de un alta mal hecha es de 5 minutos.
    #
    # ESCALERA (subir un peldaño solo si el anterior aguantó sin incidencias):
    #   1. max-age=300         ← AHORA. Alta y primeras 24-48 h.
    #   2. max-age=86400       Tras 48 h estables sirviendo HTTPS.
    #   3. max-age=31536000    Solo DESPUÉS de ver la PRIMERA RENOVACIÓN
    #                          AUTOMÁTICA de certbot completarse correctamente
    #                          (~día 60) y el reload del deploy-hook funcionar.
    #                          Antes de eso no hay evidencia de que la
    #                          renovación desatendida funcione en este dominio.
    # `includeSubDomains` se añade en el peldaño 3, no antes: afectaría a
    # cualquier subdominio de laredtelco.com que no controlemos.
    add_header Strict-Transport-Security "max-age=300" always;

    # ── inline: snippets/proxy-common.conf ──

    # Cabeceras de proxy comunes hacia los upstreams internos (API y web player).

    # Se incluye a nivel de server{}.

    #

    # ⚠ nginx NO fusiona `proxy_set_header` entre niveles: cualquier location{} que

    #   declare su propio proxy_set_header DESCARTA todas las de este archivo.

    #   Eso es intencional en /stream/* y en /__stream_auth (ver stream-gate.conf),

    #   que mandan su propio juego mínimo de cabeceras. No lo "arregles".


    proxy_http_version 1.1;


    proxy_set_header Host      $host;

    proxy_set_header X-Real-IP $remote_addr;


    # ── X-Forwarded-For = $remote_addr, NO $proxy_add_x_forwarded_for ────────────

    #

    # `$proxy_add_x_forwarded_for` ANEXA a la cabecera X-Forwarded-For que mandó el

    # cliente. Aguas abajo la aplicación lee el PRIMER elemento de la lista:

    #

    #     app/middleware/rate_limit.py  ->  _get_ip():  forwarded.split(",")[0]

    #     app/api/client/playback.py    ->  _get_ip():  forwarded.split(",")[0]

    #

    # Es decir: cualquiera puede mandar `X-Forwarded-For: 1.2.3.4` y la app tratará

    # 1.2.3.4 como su IP. Eso convierte el rate limiting del login en evadible

    # (una IP falsa distinta por intento) y ensucia la identidad de cliente que usa

    # el gate de playback. Sobrescribir con $remote_addr corta la suplantación de

    # raíz: la app solo puede ver la IP real de la conexión TCP.

    #

    # Esto es correcto PORQUE NO HAY NADA DELANTE de este nginx: el registro A de

    # cada dominio apunta directo a 45.184.225.4, así que $remote_addr YA es la IP

    # del cliente.

    #

    # ⚠ SI ALGÚN DÍA SE METE UN CDN/PROXY DELANTE (Cloudflare, etc.):

    #   $remote_addr pasaría a ser la IP del edge del CDN y TODOS los clientes

    #   compartirían cubo de rate limit. Entonces hay que:

    #     1. `set_real_ip_from <rangos del CDN>;`   (uno por rango, o incluir la

    #        lista publicada por el proveedor)

    #     2. `real_ip_header CF-Connecting-IP;`      (o X-Forwarded-For si el CDN

    #        garantiza que la sanea)

    #     3. `real_ip_recursive on;`

    #   Con eso $remote_addr vuelve a ser la IP real del cliente y esta línea

    #   sigue siendo correcta SIN cambios. Lo que NUNCA hay que hacer es volver a

    #   $proxy_add_x_forwarded_for confiando en que el CDN limpia el header.

    proxy_set_header X-Forwarded-For $remote_addr;


    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header X-Forwarded-Host  $host;

    proxy_set_header X-Forwarded-Port  $server_port;
    # ── inline: snippets/app-locations.conf ──

    # Rutas de aplicación comunes a todos los vhosts de marca: health, API y player.

    # Se incluye a nivel de server{}, junto con snippets/stream-gate.conf.

    #

    # La API se proxya EN EL MISMO ORIGEN que el player a propósito: así las

    # peticiones del player son same-origin y no dependen de la lista CORS del

    # backend (app/main.py, _WEB_ORIGINS), que no incluye los dominios de

    # producción. Cada marca nueva hereda esto sin tocar código.

    #

    # ⚠ NO se exponen /docs, /redoc ni /openapi.json. Ver README.md, sección

    #   "Documentación de la API (/docs, /redoc, /openapi.json)".


    location = /health {

        proxy_pass http://nexora_api:8000/health;

    }


    location = /api/health {

        proxy_pass http://nexora_api:8000/health;

    }


    location ^~ /api/ {

        proxy_pass http://nexora_api:8000;

    }


    # Todo lo demás: el web player (SPA).

    location / {

        proxy_pass http://nexora_web_player:80;

    }
    # ── inline: snippets/stream-gate.conf ──
    # ─────────────────────────────────────────────────────────────────────────────
    #  GATE DE STREAMS (FASE 2C) — ÚNICA COPIA. Compartido por TODOS los dominios.
    #
    #  ⚠ PROPIEDAD DE SEGURIDAD: este archivo es el control de autorización de
    #    /stream/*. Existe UNA sola copia a propósito. Si se duplica por dominio,
    #    la primera divergencia entre copias (un error_page que falta, un
    #    proxy_set_header que cambia, una location nueva sin auth_request) es un
    #    agujero de autorización silencioso en una marca y no en las otras.
    #    Para dar de alta un dominio nuevo NO se copia este bloque: se incluye.
    #
    #  Contrato validado en producción (FASE 2C, 396/396 peticiones). Copiado
    #  literalmente del vhost de nexoraplay.net. NO modificar sin revalidar:
    #    · `set $stream_orig_uri` / `set $stream_token` van ANTES de auth_request
    #    · error_page 401 y 403 -> @stream_denied
    #    · access_log stream_safe en las TRES locations (las dos de stream y la
    #      de denegación): si falta en una, el token acaba en el log por defecto
    #    · los proxy_set_header son exactamente estos (ver nota de herencia abajo)
#    · las CUATRO locations de nodo llevan el bloque de caché de P1.6: si a una
#      le falta, ese nodo deja de cachear en silencio (regresión de rendimiento,
#      no de seguridad — la caché va DESPUÉS del auth_request y no puede saltarlo)
#
#  P1.6 · La caché de segmentos NO relaja este gate. `auth_request` se resuelve en
#  la fase ACCESS de nginx; la búsqueda en caché, en la fase CONTENT. ACCESS corre
#  siempre antes, así que el subrequest a FastAPI se ejecuta en TODAS las
#  peticiones, acierten o no en caché. Se cachea la respuesta del origen, nunca la
#  autorización. Probado en contenedor: runbook § 9.
    #
    #  Nginx valida cada petición /stream/* contra FastAPI antes de proxyar a
    #  Flussonic/Astra. El manifest lleva ?token= (validación completa + siembra un
    #  grant en Redis); los segmentos sin token pasan solo si están cubiertos por un
    #  grant vivo (mismo node + stream + IP de cliente).
    # ─────────────────────────────────────────────────────────────────────────────

    # Endpoint interno de autorización. `internal` => no alcanzable desde Internet,
    # solo como subrequest de auth_request.
    location = /__stream_auth {
        internal;
        # node + stream_key como query params (derivados por los maps de
        # 00-shared-http.conf); el token viaja en cabecera.
        #
        # Las $stream_* se capturan en la location /stream/* (fase rewrite) ANTES de
        # este subrequest: los subrequests comparten el array de variables `set` del
        # padre, a diferencia de $request_uri/$arg_token, que aquí se resolverían
        # contra ESTE subrequest (/__stream_auth) y llegarían vacíos.
        proxy_pass http://nexora_api:8000/internal/stream-auth/validate?node=$stream_node_v&stream_key=$stream_key_v;
        proxy_pass_request_body off;
