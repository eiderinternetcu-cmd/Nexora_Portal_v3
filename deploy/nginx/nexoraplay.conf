    location ^~ /stream/ec-main/ {
        # Capturar URI original + token en variables compartidas ANTES del subrequest.
        set $stream_orig_uri $request_uri;
        set $stream_token $arg_token;
        auth_request /__stream_auth;
        error_page 401 = @stream_denied;
        error_page 403 = @stream_denied;
        access_log /dev/stdout stream_safe;

        proxy_pass http://181.78.246.211:8002/;          # Esmeraldas (Astra)
        proxy_http_version 1.1;
        # OJO: declarar proxy_set_header aquí ANULA los de snippets/proxy-common.conf
        # para esta location. Es deliberado: al origen de vídeo solo se le manda lo
        # imprescindible (y Host tiene que ser $proxy_host, no $host).
        proxy_set_header Host $proxy_host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        # ── P1.6 · caché de segmentos HLS ────────────────────────────────────
        # Expandido de snippets/stream-cache.conf. LA FUENTE DE VERDAD ES ESE
        # ARCHIVO: allí está el razonamiento completo de cada directiva; aquí se
        # conserva solo lo que no se puede perder sin invitar a un "arreglo" que
        # rompa algo. Si tocas una copia, tócalas las OCHO (4 nodos × 2 vhosts).
        #
        # NO DEBILITA EL GATE: auth_request se resuelve en la fase ACCESS y la
        # caché en la fase CONTENT; ACCESS va siempre primero, así que el
        # subrequest a FastAPI corre en TODAS las peticiones, acierten o no.
        proxy_cache hls_cache;

        # LA CLAVE NO LLEVA EL TOKEN. El default de nginx es
        # $scheme$proxy_host$request_uri y $request_uri INCLUYE la query: con él,
        # el ?token= de cada espectador crearía su propia entrada y el acierto
        # sería 0 %. $uri es el path SIN query: identifica el RECURSO, no a quién
        # lo pide. Sin $host a propósito: las dos marcas piden los mismos bytes
        # al mismo origen y comparten entrada.
        proxy_cache_key $proxy_host$uri;

        # El manifiesto es mutable (se reescribe cada hls_time=4 s): TTL cero.
        # Hacen falta las dos directivas: bypass no lee, no_cache no escribe.
        proxy_cache_bypass $stream_is_manifest;
        proxy_no_cache     $stream_is_manifest;

        # 30 s = ventana de directo del origen (hls_time 4 × hls_list_size 6 =
        # 24 s) + margen. Más no sirve: delete_segments los borra a los ~28 s.
        proxy_cache_valid 200 30s;
        proxy_cache_valid 404 1s;

        # Cumple el AC "N espectadores → 1 conexión al origen": sin el lock, N
        # peticiones simultáneas de un segmento frío son N tiradas al origen.
        proxy_cache_lock on;
        proxy_cache_lock_age 5s;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale updating;

        # Sin esto la caché no guarda NADA: los orígenes marcan los segmentos
        # con Cache-Control: no-cache. Set-Cookie NO se ignora a propósito.
        proxy_ignore_headers Cache-Control Expires X-Accel-Expires Vary;

        # proxy_cache no puede almacenar lo que no bufferiza: esta línea sustituye
        # al antiguo `proxy_buffering off` (declararlo dos veces = no arranca).
        proxy_buffering on;
        proxy_buffers 32 32k;
        proxy_busy_buffers_size 64k;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    location ^~ /stream/co-main/ {
