        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout;
        proxy_redirect off;
    }

    location @stream_denied {
        access_log /dev/stdout stream_safe;
        default_type application/json;
        return 401 '{"success":false,"error":"playback token required or invalid"}';
    }
}

# ── PENDIENTE (fuera del alcance de nginx) ───────────────────────────────────
# El gate de /stream/ queda inerte en este dominio mientras el backend siga
# emitiendo playback_url apuntando a nexoraplay.net: _resolve_playback_url()
# construye la URL desde FLUSSONIC_PUBLIC_*_BASE_URL, un valor fijo, sin mirar
# el Host de la petición. Dos salidas:
#   A) (recomendada) que _resolve_playback_url() use el host de la petición ->
#      cada dominio se sirve a sí mismo, cero CORS, cero cambios al añadir marcas.
#   B) dejar que los streams salgan por nexoraplay.net y abrir CORS en su
#      location /stream/ — más rápido, pero abre cross-origin sobre la ruta
#      endurecida en FASE 2C y hay que revalidar el gate con preflights OPTIONS.
