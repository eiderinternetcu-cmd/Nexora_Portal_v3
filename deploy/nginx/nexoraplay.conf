    # Torre de transcodificacion de Miami (66.163.125.89). Mismo gate, pero el origen
    # esta al otro lado de internet y no en la red Docker: de ahi los timeouts
    # explicitos. Su 8088 esta cerrado por firewall a todo salvo la IP de este edge.
    #
    # A diferencia de tc-main, aqui el upstream es una IP literal, asi que NO crea
    # dependencia de arranque: nginx levanta aunque la torre este apagada.
    location ^~ /stream/tc-mia/ {
        set $stream_orig_uri $request_uri;
        set $stream_token $arg_token;
        auth_request /__stream_auth;
        error_page 401 = @stream_denied;
        error_page 403 = @stream_denied;
        access_log /dev/stdout stream_safe;

        proxy_pass http://66.163.125.89:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        # ── P1.6 · caché de segmentos HLS (misma copia que los otros nodos) ──
        # Fuente de verdad: snippets/stream-cache.conf. Si tocas una copia,
        # tócalas las OCHO (4 nodos × 2 vhosts).
        #
        # NO DEBILITA EL GATE: auth_request se resuelve en la fase ACCESS y la
        # caché en la fase CONTENT; ACCESS va siempre primero, así que el
        # subrequest a FastAPI corre en TODAS las peticiones, acierten o no.
        proxy_cache hls_cache;

