# ══════════════════════════════════════════════════════════════════════════
#  ARCHIVO GENERADO — no editar a mano.
#
#  Fuente de verdad: deploy/nginx/conf.d/ + deploy/nginx/snippets/
#  Regenerar con scratchpad/generar_conf.py y recargar con:
#      docker exec nexora_nginx nginx -t && docker exec nexora_nginx nginx -s reload
#
#  Existe porque el compose de produccion monta este archivo suelto en
#  /etc/nginx/conf.d/default.conf. Cuando el montaje pase a los directorios
#  conf.d/ y snippets/, este archivo deja de hacer falta.
# ══════════════════════════════════════════════════════════════════════════


# ═══ desde conf.d/00-shared-http.conf ═══

# ─────────────────────────────────────────────────────────────────────────────
#  Definiciones compartidas de scope http{} — maps + log_format.
#  Todo lo de este archivo lo consumen los vhosts de conf.d/*.conf.
#
#  ⚠ EL PREFIJO "00-" ES FUNCIONAL. NO RENOMBRAR ESTE ARCHIVO.
#
#  nginx incluye conf.d/*.conf por ORDEN ALFABÉTICO y resuelve `log_format`
#  en TIEMPO DE PARSEO: si un vhost hace `access_log ... stream_safe;` antes de
#  que nginx haya leído la directiva `log_format stream_safe`, aborta con:
#
#      nginx: [emerg] unknown log format "stream_safe" in /etc/nginx/conf.d/...
#
#  Reproducido en nginx:1.27-alpine: con `laredtelco.conf` (l < n) el arranque
#  falla si la definición vive en `nexoraplay.conf`. El prefijo `00-` garantiza
#  que este archivo se parsea ANTES que cualquier vhost.
#
#  Los `map` en cambio SÍ toleran referencia adelantada (se resuelven en tiempo
#  de petición), pero se agrupan aquí por coherencia y para tener una sola copia.
# ─────────────────────────────────────────────────────────────────────────────

# ── Logging de /stream/* sin filtrar el token ────────────────────────────────
# El token de reproducción viaja en ?token=...; escribirlo en el access log
# equivale a persistir credenciales. Este map deja solo el path.
map $request_uri $loggable_stream_uri {
    ~^(?<path_only>[^?]*)   $path_only;   # descarta la query string entera
    default                 $request_uri;
}

# `cache=` al final lo añade P1.6: es la ÚNICA forma de medir el acierto de la
# caché de segmentos desde fuera del contenedor. No se expone como cabecera de
# respuesta (`add_header X-Cache-Status ...`) a propósito: nginx NO fusiona
# `add_header` entre niveles, así que declararlo dentro de las locations de
# /stream/* borraría las de snippets/security-headers.conf y el HSTS del vhost
# para todas las respuestas de vídeo. Ver README.md y el aviso de ese snippet.
# Valores: HIT / MISS / BYPASS / EXPIRED / UPDATING / STALE, y `-` cuando la
# respuesta no pasó por un upstream (p. ej. el 401 de @stream_denied).
log_format stream_safe '$remote_addr - [$time_local] "$request_method $loggable_stream_uri" '
                       '$status $body_bytes_sent cache=$upstream_cache_status';

# ── Derivación de node + stream_key para el subrequest de autorización ───────
# Se calculan a partir de $stream_orig_uri, que las locations de /stream/*
# fijan con `set` ANTES del auth_request (ver snippets/stream-gate.conf).
# Se pasan al backend como query params (no son secretos); el token va en
# cabecera X-Playback-Token.
map $stream_orig_uri $stream_node_v {
    ~^/stream/(?<n>[^/]+)/   $n;
    default                  "";
}

map $stream_orig_uri $stream_key_v {
    ~^/stream/[^/]+/(?<k>[^/?]+)   $k;
    default                        "";
}

# ── P1.6 · Caché de segmentos HLS en el edge ─────────────────────────────────
#  Problema que resuelve: /stream/* dejó de ser un redirect y pasó a ser un relé
#  (proxy_pass de cada segmento al origen). Sin caché, N espectadores del mismo
#  canal son N tiradas contra una cabecera que ya va al 74 % de CPU y 191,9 Mbps:
#  el sistema escala con ESPECTADORES, no con canales. Los .ts son inmutables,
#  así que N espectadores deben colapsar en UNA tirada. Ver docs/ROADMAP.md § P1.6.
#
#  ⚠ LA CACHÉ NO DEBILITA EL GATE. `auth_request` se resuelve en la fase ACCESS
#    de nginx y la búsqueda en caché ocurre en la fase CONTENT (dentro del módulo
#    upstream). ACCESS va SIEMPRE antes que CONTENT, así que el subrequest a
#    FastAPI se ejecuta en cada petición, acierte o falle la caché. Se cachea la
#    RESPUESTA del origen, jamás la autorización. Verificado en contenedor, no
#    asumido: ver deploy/RUNBOOK_EDGE_MULTIDOMINIO.md § 9.
#
#  DIMENSIONADO (aritmética, no un valor copiado de un blog):
#    · Segmento = hls_time 4 s × ~3 Mbps de media = 12 Mbit ≈ 1,5 MB
#      (hls_time y el GOP cerrado `-g 60 -keyint_min 60 -sc_threshold 0` salen de
#       docker-compose.transcode.production.yml; ~3 Mbps es la media del ROADMAP).
#    · TTL de segmento 30 s → 30/4 ≈ 8 segmentos vivos por canal ≈ 12 MB.
#    · inactive=45s (apenas por encima del TTL) acota lo que queda en disco ya
#      expirado: 45/4 ≈ 11 segmentos ≈ 17 MB por canal.
#    · Peor caso absoluto, los 41 canales vistos a la vez: 41 × 17 MB ≈ 692 MB.
#    → max_size=1g deja ~45 % de margen sobre ese peor caso Y es un techo DURO
#      (el cache manager desaloja por LRU). Producción es una VPS: 1 GB acotado y
#      predecible, no "el disco que haya".
#    → keys_zone=4m ≈ 32.000 claves (nginx: ~8.000 claves por MB) contra un
#      conjunto de trabajo calculado de ~460. 70× de margen por 4 MB de memoria
#      compartida; si la zona se llenara, nginx desaloja a la fuerza y el acierto
#      caería en silencio, y esos 4 MB son el seguro más barato de la config.
#    · use_temp_path=off: sin esto nginx escribe en proxy_temp_path y luego COPIA
#      el archivo a la caché (dos escrituras por segmento). Con off, el temporal
#      nace en el mismo sistema de archivos y el paso final es un rename.
#
#  Alternativa si el desgaste de SSD preocupa (~7,5 MB/s sostenidos con 20 canales
#  concurrentes): montar /var/cache/nginx/hls como tmpfs de 1 GB. NO se hace por
#  defecto porque quedarse sin RAM tumba la VPS entera y quedarse sin disco no.
#  Ver el runbook § 9.
proxy_cache_path /var/cache/nginx/hls
                 levels=1:2
                 keys_zone=hls_cache:4m
                 max_size=1g
                 inactive=45s
                 use_temp_path=off;

# ¿Esta petición es un manifiesto? Se evalúa sobre $uri (path normalizado, SIN
# query string), así que el ?token= no interfiere.
#
# El manifiesto es lo contrario del segmento: MUTABLE y de vida corta. El origen
# lo reescribe cada hls_time=4 s y solo publica una ventana de hls_list_size=6
# segmentos (~24 s). Servirlo con cualquier antigüedad congela el directo y, si
# el cliente pide un segmento que el origen ya borró (`-hls_flags delete_segments`),
# rompe la reproducción con 404. Por eso su TTL efectivo es CERO: no se cachea.
#
# Por qué CERO y no "1 s": nginx no admite variables en `proxy_cache_valid`, así
# que dar TTLs distintos a .m3u8 y a .ts exige una location anidada por extensión
# — y una location por REGEX no admite `proxy_pass` con parte de URI (el `/` final
# que recorta el prefijo /stream/<nodo>/). Habría que reproducir ese recorte con
# un `rewrite ... break` explícito en 8 sitios (4 nodos × 2 vhosts), cada uno una
# oportunidad de mandar al origen un path mal recortado SOLO para manifiestos.
# El manifiesto son ~300 bytes cada 4 s: no justifica ese riesgo. Todo el ahorro
# de ancho de banda está en los segmentos, y ahí sí se cachea.
map $uri $stream_is_manifest {
    ~*\.(m3u8|mpd)$   1;
    default           0;      # proxy_no_cache/bypass: "" y "0" cuentan como falso
}


# ═══ desde conf.d/00-default-server.conf ═══

# ─────────────────────────────────────────────────────────────────────────────
#  Servidor CATCH-ALL (default_server) para :80 y :443.
#
#  ¿Por qué existe? Sin un `default_server` explícito, nginx nombra default al
#  PRIMER server{} que encuentre para cada par listen. Con un único vhost eso
#  era inofensivo; con dos o más archivos el default pasa a depender del orden
#  alfabético de conf.d/ — es decir, de cómo alguien decida llamar al fichero de
#  la marca N+1. Aquí se fija de forma explícita y estable.
#
#  Efecto: cualquier petición con un Host desconocido (escáneres, IP directa,
#  dominios apuntados a este servidor sin vhost) cae aquí y NO es servida por
#  el vhost de una marca cualquiera.
#
#  ⚠ Este archivo se parsea ANTES que 00-shared-http.conf ("d" < "s"), así que
#    NO puede referenciar `log_format stream_safe` ni ningún otro símbolo
#    definido allí. Si necesitas logging con formato aquí, usa `combined`.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ⚠ DEPENDENCIA INVISIBLE — NO BORRAR.
    #
    # Este bloque es quien responde el reto HTTP-01 de Let's Encrypt para un
    # dominio que TODAVÍA NO TIENE VHOST. Es el caso exacto del alta de una
    # marca nueva: primero se pide el certificado, y hasta que el cert no
    # existe no se puede cargar su vhost (nginx no arranca si ssl_certificate
    # apunta a una ruta inexistente). Sin esta location, certbot --webroot
    # falla y el alta entra en un bloqueo circular:
    #   vhost necesita cert  →  cert necesita reto HTTP-01  →  reto necesita vhost.
    #
    # Ver deploy/nginx/README.md, "Alta de un dominio nuevo".
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Host desconocido: cerrar sin responder. No revela qué se sirve aquí ni
    # redirige a un dominio que no le corresponde al peticionario.
    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Rechaza el handshake TLS (nginx >= 1.19.4) en vez de presentar el
    # certificado del primer vhost a quien pregunta por un Host ajeno.
    # No requiere ssl_certificate, que es justo la gracia: no hay cert que
    # filtrar ni que mantener para el catch-all.
    ssl_reject_handshake on;
}


# ═══ desde conf.d/nexoraplay.conf ═══

# ─────────────────────────────────────────────────────────────────────────────
#  vhost: nexoraplay.net (marca original)
#
#  Este archivo solo contiene lo que es ESPECÍFICO del dominio:
#  server_name, certificados y política de HSTS. Todo lo compartido vive en
#  ../snippets/ y en 00-shared-http.conf. Dar de alta una marca nueva = copiar
#  este archivo y cambiar tres cosas. Ver README.md.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name nexoraplay.net www.nexoraplay.net;

    # Reto ACME para renovaciones de ESTE dominio (el alta inicial de un dominio
    # sin vhost la atiende 00-default-server.conf).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen 443 ssl http2;` está deprecado desde nginx 1.25 (imagen: 1.27).
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nexoraplay.net www.nexoraplay.net;

    ssl_certificate         /etc/letsencrypt/live/nexoraplay.net/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/nexoraplay.net/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/nexoraplay.net/chain.pem;
    # ── inline: snippets/tls-common.conf ──
    # Parámetros TLS comunes a todos los vhosts HTTPS.
    # Se incluye DENTRO de server{}, después de los ssl_certificate/ssl_certificate_key
    # (que son por dominio y viven en el vhost).
    #
    # NOTA: `listen 443 ssl http2;` está DEPRECADO desde nginx 1.25 (la imagen es
    # 1.27). La forma correcta es `listen 443 ssl;` + `http2 on;` en el server{}.
    # `http2 on` no se pone aquí a propósito: es una directiva de server, no de TLS,
    # y se declara junto al listen para que se lea al lado de lo que afecta.

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    client_max_body_size 20m;

    # ── inline: snippets/security-headers.conf ──

    # Cabeceras de seguridad comunes a todos los vhosts HTTPS.

    #

    # HSTS (Strict-Transport-Security) NO está aquí: su max-age depende de la

    # MADUREZ de cada dominio (un dominio recién dado de alta debe arrancar con un

    # max-age corto para poder revertir sin dejar a los clientes clavados en HTTPS

    # durante un año). Se declara en cada vhost. Ver README.md, "Escalera de HSTS".

    #

    # ⚠ nginx NO fusiona `add_header` entre niveles: si una location{} declara su

    #   propio add_header, TODOS estos desaparecen para esa location. Si añades

    #   add_header en alguna location, replica también estos.


    add_header X-Frame-Options        "SAMEORIGIN"                    always;

    add_header X-Content-Type-Options "nosniff"                       always;

    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # HSTS maduro: este dominio lleva más de un año sirviendo HTTPS sin
    # incidencias de certificado. Un dominio NUEVO no debe copiar este valor,
    # arranca en max-age=300. Ver README.md, "Escalera de HSTS".
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── inline: snippets/proxy-common.conf ──

    # Cabeceras de proxy comunes hacia los upstreams internos (API y web player).

    # Se incluye a nivel de server{}.

    #

    # ⚠ nginx NO fusiona `proxy_set_header` entre niveles: cualquier location{} que

    #   declare su propio proxy_set_header DESCARTA todas las de este archivo.

    #   Eso es intencional en /stream/* y en /__stream_auth (ver stream-gate.conf),

    #   que mandan su propio juego mínimo de cabeceras. No lo "arregles".


    proxy_http_version 1.1;


    proxy_set_header Host      $host;

    proxy_set_header X-Real-IP $remote_addr;


    # ── X-Forwarded-For = $remote_addr, NO $proxy_add_x_forwarded_for ────────────

    #

    # `$proxy_add_x_forwarded_for` ANEXA a la cabecera X-Forwarded-For que mandó el

    # cliente. Aguas abajo la aplicación lee el PRIMER elemento de la lista:

    #

    #     app/middleware/rate_limit.py  ->  _get_ip():  forwarded.split(",")[0]

    #     app/api/client/playback.py    ->  _get_ip():  forwarded.split(",")[0]

    #

    # Es decir: cualquiera puede mandar `X-Forwarded-For: 1.2.3.4` y la app tratará

    # 1.2.3.4 como su IP. Eso convierte el rate limiting del login en evadible

    # (una IP falsa distinta por intento) y ensucia la identidad de cliente que usa

    # el gate de playback. Sobrescribir con $remote_addr corta la suplantación de

    # raíz: la app solo puede ver la IP real de la conexión TCP.

    #

    # Esto es correcto PORQUE NO HAY NADA DELANTE de este nginx: el registro A de

    # cada dominio apunta directo a 45.184.225.4, así que $remote_addr YA es la IP

    # del cliente.

    #

    # ⚠ SI ALGÚN DÍA SE METE UN CDN/PROXY DELANTE (Cloudflare, etc.):

    #   $remote_addr pasaría a ser la IP del edge del CDN y TODOS los clientes

    #   compartirían cubo de rate limit. Entonces hay que:

    #     1. `set_real_ip_from <rangos del CDN>;`   (uno por rango, o incluir la

    #        lista publicada por el proveedor)

    #     2. `real_ip_header CF-Connecting-IP;`      (o X-Forwarded-For si el CDN

    #        garantiza que la sanea)

    #     3. `real_ip_recursive on;`

    #   Con eso $remote_addr vuelve a ser la IP real del cliente y esta línea

    #   sigue siendo correcta SIN cambios. Lo que NUNCA hay que hacer es volver a

    #   $proxy_add_x_forwarded_for confiando en que el CDN limpia el header.

    proxy_set_header X-Forwarded-For $remote_addr;


    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header X-Forwarded-Host  $host;

    proxy_set_header X-Forwarded-Port  $server_port;
    # ── inline: snippets/app-locations.conf ──

    # Rutas de aplicación comunes a todos los vhosts de marca: health, API y player.

    # Se incluye a nivel de server{}, junto con snippets/stream-gate.conf.

    #

    # La API se proxya EN EL MISMO ORIGEN que el player a propósito: así las

    # peticiones del player son same-origin y no dependen de la lista CORS del

    # backend (app/main.py, _WEB_ORIGINS), que no incluye los dominios de

    # producción. Cada marca nueva hereda esto sin tocar código.

    #

    # ⚠ NO se exponen /docs, /redoc ni /openapi.json. Ver README.md, sección

    #   "Documentación de la API (/docs, /redoc, /openapi.json)".


    location = /health {

        proxy_pass http://nexora_api:8000/health;

    }


    location = /api/health {

        proxy_pass http://nexora_api:8000/health;

    }


    location ^~ /api/ {

        proxy_pass http://nexora_api:8000;

    }


    # Todo lo demás: el web player (SPA).

    location / {

        proxy_pass http://nexora_web_player:80;

    }
    # ── inline: snippets/stream-gate.conf ──
    # ─────────────────────────────────────────────────────────────────────────────
    #  GATE DE STREAMS (FASE 2C) — ÚNICA COPIA. Compartido por TODOS los dominios.
    #
    #  ⚠ PROPIEDAD DE SEGURIDAD: este archivo es el control de autorización de
    #    /stream/*. Existe UNA sola copia a propósito. Si se duplica por dominio,
    #    la primera divergencia entre copias (un error_page que falta, un
    #    proxy_set_header que cambia, una location nueva sin auth_request) es un
    #    agujero de autorización silencioso en una marca y no en las otras.
    #    Para dar de alta un dominio nuevo NO se copia este bloque: se incluye.
    #
    #  Contrato validado en producción (FASE 2C, 396/396 peticiones). Copiado
    #  literalmente del vhost de nexoraplay.net. NO modificar sin revalidar:
    #    · `set $stream_orig_uri` / `set $stream_token` van ANTES de auth_request
    #    · error_page 401 y 403 -> @stream_denied
    #    · access_log stream_safe en las TRES locations (las dos de stream y la
    #      de denegación): si falta en una, el token acaba en el log por defecto
    #    · los proxy_set_header son exactamente estos (ver nota de herencia abajo)
#    · las CUATRO locations de nodo llevan el bloque de caché de P1.6: si a una
#      le falta, ese nodo deja de cachear en silencio (regresión de rendimiento,
#      no de seguridad — la caché va DESPUÉS del auth_request y no puede saltarlo)
#
#  P1.6 · La caché de segmentos NO relaja este gate. `auth_request` se resuelve en
#  la fase ACCESS de nginx; la búsqueda en caché, en la fase CONTENT. ACCESS corre
#  siempre antes, así que el subrequest a FastAPI se ejecuta en TODAS las
#  peticiones, acierten o no en caché. Se cachea la respuesta del origen, nunca la
#  autorización. Probado en contenedor: runbook § 9.
    #
    #  Nginx valida cada petición /stream/* contra FastAPI antes de proxyar a
    #  Flussonic/Astra. El manifest lleva ?token= (validación completa + siembra un
    #  grant en Redis); los segmentos sin token pasan solo si están cubiertos por un
    #  grant vivo (mismo node + stream + IP de cliente).
    # ─────────────────────────────────────────────────────────────────────────────

    # Endpoint interno de autorización. `internal` => no alcanzable desde Internet,
    # solo como subrequest de auth_request.
    location = /__stream_auth {
        internal;
        # node + stream_key como query params (derivados por los maps de
        # 00-shared-http.conf); el token viaja en cabecera.
        #
        # Las $stream_* se capturan en la location /stream/* (fase rewrite) ANTES de
        # este subrequest: los subrequests comparten el array de variables `set` del
        # padre, a diferencia de $request_uri/$arg_token, que aquí se resolverían
        # contra ESTE subrequest (/__stream_auth) y llegarían vacíos.
        proxy_pass http://nexora_api:8000/internal/stream-auth/validate?node=$stream_node_v&stream_key=$stream_key_v;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Playback-Token $stream_token;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $remote_addr;
    }

    location ^~ /stream/ec-main/ {
        # Capturar URI original + token en variables compartidas ANTES del subrequest.
        set $stream_orig_uri $request_uri;
        set $stream_token $arg_token;
        auth_request /__stream_auth;
        error_page 401 = @stream_denied;
        error_page 403 = @stream_denied;
        access_log /dev/stdout stream_safe;

        proxy_pass http://181.78.246.211:8002/;          # Esmeraldas (Astra)
        proxy_http_version 1.1;
        # OJO: declarar proxy_set_header aquí ANULA los de snippets/proxy-common.conf
        # para esta location. Es deliberado: al origen de vídeo solo se le manda lo
        # imprescindible (y Host tiene que ser $proxy_host, no $host).
        proxy_set_header Host $proxy_host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        # ── P1.6 · caché de segmentos HLS ────────────────────────────────────
        # Expandido de snippets/stream-cache.conf. LA FUENTE DE VERDAD ES ESE
        # ARCHIVO: allí está el razonamiento completo de cada directiva; aquí se
        # conserva solo lo que no se puede perder sin invitar a un "arreglo" que
        # rompa algo. Si tocas una copia, tócalas las OCHO (4 nodos × 2 vhosts).
        #
        # NO DEBILITA EL GATE: auth_request se resuelve en la fase ACCESS y la
        # caché en la fase CONTENT; ACCESS va siempre primero, así que el
        # subrequest a FastAPI corre en TODAS las peticiones, acierten o no.
        proxy_cache hls_cache;

        # LA CLAVE NO LLEVA EL TOKEN. El default de nginx es
        # $scheme$proxy_host$request_uri y $request_uri INCLUYE la query: con él,
        # el ?token= de cada espectador crearía su propia entrada y el acierto
        # sería 0 %. $uri es el path SIN query: identifica el RECURSO, no a quién
        # lo pide. Sin $host a propósito: las dos marcas piden los mismos bytes
        # al mismo origen y comparten entrada.
        proxy_cache_key $proxy_host$uri;

        # El manifiesto es mutable (se reescribe cada hls_time=4 s): TTL cero.
        # Hacen falta las dos directivas: bypass no lee, no_cache no escribe.
        proxy_cache_bypass $stream_is_manifest;
        proxy_no_cache     $stream_is_manifest;

        # 30 s = ventana de directo del origen (hls_time 4 × hls_list_size 6 =
        # 24 s) + margen. Más no sirve: delete_segments los borra a los ~28 s.
        proxy_cache_valid 200 30s;
        proxy_cache_valid 404 1s;

        # Cumple el AC "N espectadores → 1 conexión al origen": sin el lock, N
        # peticiones simultáneas de un segmento frío son N tiradas al origen.
        proxy_cache_lock on;
        proxy_cache_lock_age 5s;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale updating;

