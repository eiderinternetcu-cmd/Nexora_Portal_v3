# ─────────────────────────────────────────────────────────────────────────────
#  vhost: nexoraplay.net (marca original)
#
#  Este archivo solo contiene lo que es ESPECÍFICO del dominio:
#  server_name, certificados y política de HSTS. Todo lo compartido vive en
#  ../snippets/ y en 00-shared-http.conf. Dar de alta una marca nueva = copiar
#  este archivo y cambiar tres cosas. Ver README.md.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name nexoraplay.net www.nexoraplay.net;

    # Reto ACME para renovaciones de ESTE dominio (el alta inicial de un dominio
    # sin vhost la atiende 00-default-server.conf).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen 443 ssl http2;` está deprecado desde nginx 1.25 (imagen: 1.27).
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nexoraplay.net www.nexoraplay.net;

    ssl_certificate         /etc/letsencrypt/live/nexoraplay.net/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/nexoraplay.net/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/nexoraplay.net/chain.pem;
    include /etc/nginx/snippets/tls-common.conf;

    client_max_body_size 20m;

    include /etc/nginx/snippets/security-headers.conf;
    # HSTS maduro: este dominio lleva más de un año sirviendo HTTPS sin
    # incidencias de certificado. Un dominio NUEVO no debe copiar este valor,
    # arranca en max-age=300. Ver README.md, "Escalera de HSTS".
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/proxy-common.conf;

    include /etc/nginx/snippets/app-locations.conf;
    include /etc/nginx/snippets/stream-gate.conf;

    # ── /docs, /redoc, /openapi.json ────────────────────────────────────────────
    # DEUDA CONOCIDA, conservada a proposito para que este despliegue sea
    # puramente aditivo: hoy ya estan publicos y sin auth en este dominio, y
    # quitarlos es el unico cambio que ROMPERIA algo existente (cualquier
    # herramienta o partner que consuma el esquema). Se retira en un cambio
    # propio, tras comprobar en los access logs que nadie los usa.
    #
    # Por que hay que retirarlos: el esquema publica el mapa completo de la API,
    # incluido /internal/stream-auth/validate y su contrato de parametros — el
    # mapa exacto que necesita quien quiera atacar la autorizacion de playback.
    # El arreglo real no es nginx sino docs_url=None / redoc_url=None cuando
    # APP_ENV=production (app/main.py:102-103): nginx solo los esconde de
    # Internet, siguen expuestos a cualquiera dentro de la red Docker.
    #
    # NO se replican en los vhosts de marca nueva: laredtelco.conf nace sin ellos.
    location ^~ /docs {
        proxy_pass http://nexora_api:8000;
    }

    location ^~ /redoc {
        proxy_pass http://nexora_api:8000;
    }

    location = /openapi.json {
        proxy_pass http://nexora_api:8000/openapi.json;
    }
}
