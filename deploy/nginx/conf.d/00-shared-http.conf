# ─────────────────────────────────────────────────────────────────────────────
#  Definiciones compartidas de scope http{} — maps + log_format.
#  Todo lo de este archivo lo consumen los vhosts de conf.d/*.conf.
#
#  ⚠ EL PREFIJO "00-" ES FUNCIONAL. NO RENOMBRAR ESTE ARCHIVO.
#
#  nginx incluye conf.d/*.conf por ORDEN ALFABÉTICO y resuelve `log_format`
#  en TIEMPO DE PARSEO: si un vhost hace `access_log ... stream_safe;` antes de
#  que nginx haya leído la directiva `log_format stream_safe`, aborta con:
#
#      nginx: [emerg] unknown log format "stream_safe" in /etc/nginx/conf.d/...
#
#  Reproducido en nginx:1.27-alpine: con `laredtelco.conf` (l < n) el arranque
#  falla si la definición vive en `nexoraplay.conf`. El prefijo `00-` garantiza
#  que este archivo se parsea ANTES que cualquier vhost.
#
#  Los `map` en cambio SÍ toleran referencia adelantada (se resuelven en tiempo
#  de petición), pero se agrupan aquí por coherencia y para tener una sola copia.
# ─────────────────────────────────────────────────────────────────────────────

# ── Logging de /stream/* sin filtrar el token ────────────────────────────────
# El token de reproducción viaja en ?token=...; escribirlo en el access log
# equivale a persistir credenciales. Este map deja solo el path.
map $request_uri $loggable_stream_uri {
    ~^(?<path_only>[^?]*)   $path_only;   # descarta la query string entera
    default                 $request_uri;
}

# `cache=` al final lo añade P1.6: es la ÚNICA forma de medir el acierto de la
# caché de segmentos desde fuera del contenedor. No se expone como cabecera de
# respuesta (`add_header X-Cache-Status ...`) a propósito: nginx NO fusiona
# `add_header` entre niveles, así que declararlo dentro de las locations de
# /stream/* borraría las de snippets/security-headers.conf y el HSTS del vhost
# para todas las respuestas de vídeo. Ver README.md y el aviso de ese snippet.
# Valores: HIT / MISS / BYPASS / EXPIRED / UPDATING / STALE, y `-` cuando la
# respuesta no pasó por un upstream (p. ej. el 401 de @stream_denied).
log_format stream_safe '$remote_addr - [$time_local] "$request_method $loggable_stream_uri" '
                       '$status $body_bytes_sent cache=$upstream_cache_status';

# ── Derivación de node + stream_key para el subrequest de autorización ───────
# Se calculan a partir de $stream_orig_uri, que las locations de /stream/*
# fijan con `set` ANTES del auth_request (ver snippets/stream-gate.conf).
# Se pasan al backend como query params (no son secretos); el token va en
# cabecera X-Playback-Token.
map $stream_orig_uri $stream_node_v {
    ~^/stream/(?<n>[^/]+)/   $n;
    default                  "";
}

map $stream_orig_uri $stream_key_v {
    ~^/stream/[^/]+/(?<k>[^/?]+)   $k;
    default                        "";
}

# ── P1.6 · Caché de segmentos HLS en el edge ─────────────────────────────────
#  Problema que resuelve: /stream/* dejó de ser un redirect y pasó a ser un relé
#  (proxy_pass de cada segmento al origen). Sin caché, N espectadores del mismo
#  canal son N tiradas contra una cabecera que ya va al 74 % de CPU y 191,9 Mbps:
#  el sistema escala con ESPECTADORES, no con canales. Los .ts son inmutables,
#  así que N espectadores deben colapsar en UNA tirada. Ver docs/ROADMAP.md § P1.6.
#
#  ⚠ LA CACHÉ NO DEBILITA EL GATE. `auth_request` se resuelve en la fase ACCESS
#    de nginx y la búsqueda en caché ocurre en la fase CONTENT (dentro del módulo
#    upstream). ACCESS va SIEMPRE antes que CONTENT, así que el subrequest a
#    FastAPI se ejecuta en cada petición, acierte o falle la caché. Se cachea la
#    RESPUESTA del origen, jamás la autorización. Verificado en contenedor, no
#    asumido: ver deploy/RUNBOOK_EDGE_MULTIDOMINIO.md § 9.
#
#  DIMENSIONADO (aritmética, no un valor copiado de un blog):
#    · Segmento = hls_time 4 s × ~3 Mbps de media = 12 Mbit ≈ 1,5 MB
#      (hls_time y el GOP cerrado `-g 60 -keyint_min 60 -sc_threshold 0` salen de
#       docker-compose.transcode.production.yml; ~3 Mbps es la media del ROADMAP).
#    · TTL de segmento 30 s → 30/4 ≈ 8 segmentos vivos por canal ≈ 12 MB.
#    · inactive=45s (apenas por encima del TTL) acota lo que queda en disco ya
#      expirado: 45/4 ≈ 11 segmentos ≈ 17 MB por canal.
#    · Peor caso absoluto, los 41 canales vistos a la vez: 41 × 17 MB ≈ 692 MB.
#    → max_size=1g deja ~45 % de margen sobre ese peor caso Y es un techo DURO
#      (el cache manager desaloja por LRU). Producción es una VPS: 1 GB acotado y
#      predecible, no "el disco que haya".
#    → keys_zone=4m ≈ 32.000 claves (nginx: ~8.000 claves por MB) contra un
#      conjunto de trabajo calculado de ~460. 70× de margen por 4 MB de memoria
#      compartida; si la zona se llenara, nginx desaloja a la fuerza y el acierto
#      caería en silencio, y esos 4 MB son el seguro más barato de la config.
#    · use_temp_path=off: sin esto nginx escribe en proxy_temp_path y luego COPIA
#      el archivo a la caché (dos escrituras por segmento). Con off, el temporal
#      nace en el mismo sistema de archivos y el paso final es un rename.
#
#  Alternativa si el desgaste de SSD preocupa (~7,5 MB/s sostenidos con 20 canales
#  concurrentes): montar /var/cache/nginx/hls como tmpfs de 1 GB. NO se hace por
#  defecto porque quedarse sin RAM tumba la VPS entera y quedarse sin disco no.
#  Ver el runbook § 9.
proxy_cache_path /var/cache/nginx/hls
                 levels=1:2
                 keys_zone=hls_cache:4m
                 max_size=1g
                 inactive=45s
                 use_temp_path=off;

# ¿Esta petición es un manifiesto? Se evalúa sobre $uri (path normalizado, SIN
# query string), así que el ?token= no interfiere.
#
# El manifiesto es lo contrario del segmento: MUTABLE y de vida corta. El origen
# lo reescribe cada hls_time=4 s y solo publica una ventana de hls_list_size=6
# segmentos (~24 s). Servirlo con cualquier antigüedad congela el directo y, si
# el cliente pide un segmento que el origen ya borró (`-hls_flags delete_segments`),
# rompe la reproducción con 404. Por eso su TTL efectivo es CERO: no se cachea.
#
# Por qué CERO y no "1 s": nginx no admite variables en `proxy_cache_valid`, así
# que dar TTLs distintos a .m3u8 y a .ts exige una location anidada por extensión
# — y una location por REGEX no admite `proxy_pass` con parte de URI (el `/` final
# que recorta el prefijo /stream/<nodo>/). Habría que reproducir ese recorte con
# un `rewrite ... break` explícito en 8 sitios (4 nodos × 2 vhosts), cada uno una
# oportunidad de mandar al origen un path mal recortado SOLO para manifiestos.
# El manifiesto son ~300 bytes cada 4 s: no justifica ese riesgo. Todo el ahorro
# de ancho de banda está en los segmentos, y ahí sí se cachea.
map $uri $stream_is_manifest {
    ~*\.(m3u8|mpd)$   1;
    default           0;      # proxy_no_cache/bypass: "" y "0" cuentan como falso
}
