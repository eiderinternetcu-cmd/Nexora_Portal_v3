# ─────────────────────────────────────────────────────────────────────────────
#  Servidor CATCH-ALL (default_server) para :80 y :443.
#
#  ¿Por qué existe? Sin un `default_server` explícito, nginx nombra default al
#  PRIMER server{} que encuentre para cada par listen. Con un único vhost eso
#  era inofensivo; con dos o más archivos el default pasa a depender del orden
#  alfabético de conf.d/ — es decir, de cómo alguien decida llamar al fichero de
#  la marca N+1. Aquí se fija de forma explícita y estable.
#
#  Efecto: cualquier petición con un Host desconocido (escáneres, IP directa,
#  dominios apuntados a este servidor sin vhost) cae aquí y NO es servida por
#  el vhost de una marca cualquiera.
#
#  ⚠ Este archivo se parsea ANTES que 00-shared-http.conf ("d" < "s"), así que
#    NO puede referenciar `log_format stream_safe` ni ningún otro símbolo
#    definido allí. Si necesitas logging con formato aquí, usa `combined`.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ⚠ DEPENDENCIA INVISIBLE — NO BORRAR.
    #
    # Este bloque es quien responde el reto HTTP-01 de Let's Encrypt para un
    # dominio que TODAVÍA NO TIENE VHOST. Es el caso exacto del alta de una
    # marca nueva: primero se pide el certificado, y hasta que el cert no
    # existe no se puede cargar su vhost (nginx no arranca si ssl_certificate
    # apunta a una ruta inexistente). Sin esta location, certbot --webroot
    # falla y el alta entra en un bloqueo circular:
    #   vhost necesita cert  →  cert necesita reto HTTP-01  →  reto necesita vhost.
    #
    # Ver deploy/nginx/README.md, "Alta de un dominio nuevo".
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Host desconocido: cerrar sin responder. No revela qué se sirve aquí ni
    # redirige a un dominio que no le corresponde al peticionario.
    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Rechaza el handshake TLS (nginx >= 1.19.4) en vez de presentar el
    # certificado del primer vhost a quien pregunta por un Host ajeno.
    # No requiere ssl_certificate, que es justo la gracia: no hay cert que
    # filtrar ni que mantener para el catch-all.
    ssl_reject_handshake on;
}
