# Cabeceras de proxy comunes hacia los upstreams internos (API y web player).
# Se incluye a nivel de server{}.
#
# ⚠ nginx NO fusiona `proxy_set_header` entre niveles: cualquier location{} que
#   declare su propio proxy_set_header DESCARTA todas las de este archivo.
#   Eso es intencional en /stream/* y en /__stream_auth (ver stream-gate.conf),
#   que mandan su propio juego mínimo de cabeceras. No lo "arregles".

proxy_http_version 1.1;

proxy_set_header Host      $host;
proxy_set_header X-Real-IP $remote_addr;

# ── X-Forwarded-For = $remote_addr, NO $proxy_add_x_forwarded_for ────────────
#
# `$proxy_add_x_forwarded_for` ANEXA a la cabecera X-Forwarded-For que mandó el
# cliente. Aguas abajo la aplicación lee el PRIMER elemento de la lista:
#
#     app/middleware/rate_limit.py  ->  _get_ip():  forwarded.split(",")[0]
#     app/api/client/playback.py    ->  _get_ip():  forwarded.split(",")[0]
#
# Es decir: cualquiera puede mandar `X-Forwarded-For: 1.2.3.4` y la app tratará
# 1.2.3.4 como su IP. Eso convierte el rate limiting del login en evadible
# (una IP falsa distinta por intento) y ensucia la identidad de cliente que usa
# el gate de playback. Sobrescribir con $remote_addr corta la suplantación de
# raíz: la app solo puede ver la IP real de la conexión TCP.
#
# Esto es correcto PORQUE NO HAY NADA DELANTE de este nginx: el registro A de
# cada dominio apunta directo a 45.184.225.4, así que $remote_addr YA es la IP
# del cliente.
#
# ⚠ SI ALGÚN DÍA SE METE UN CDN/PROXY DELANTE (Cloudflare, etc.):
#   $remote_addr pasaría a ser la IP del edge del CDN y TODOS los clientes
#   compartirían cubo de rate limit. Entonces hay que:
#     1. `set_real_ip_from <rangos del CDN>;`   (uno por rango, o incluir la
#        lista publicada por el proveedor)
#     2. `real_ip_header CF-Connecting-IP;`      (o X-Forwarded-For si el CDN
#        garantiza que la sanea)
#     3. `real_ip_recursive on;`
#   Con eso $remote_addr vuelve a ser la IP real del cliente y esta línea
#   sigue siendo correcta SIN cambios. Lo que NUNCA hay que hacer es volver a
#   $proxy_add_x_forwarded_for confiando en que el CDN limpia el header.
proxy_set_header X-Forwarded-For $remote_addr;

proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
