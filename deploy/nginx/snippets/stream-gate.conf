# ─────────────────────────────────────────────────────────────────────────────
#  GATE DE STREAMS (FASE 2C) — ÚNICA COPIA. Compartido por TODOS los dominios.
#
#  ⚠ PROPIEDAD DE SEGURIDAD: este archivo es el control de autorización de
#    /stream/*. Existe UNA sola copia a propósito. Si se duplica por dominio,
#    la primera divergencia entre copias (un error_page que falta, un
#    proxy_set_header que cambia, una location nueva sin auth_request) es un
#    agujero de autorización silencioso en una marca y no en las otras.
#    Para dar de alta un dominio nuevo NO se copia este bloque: se incluye.
#
#  Contrato validado en producción (FASE 2C, 396/396 peticiones). Copiado
#  literalmente del vhost de nexoraplay.net. NO modificar sin revalidar:
#    · `set $stream_orig_uri` / `set $stream_token` van ANTES de auth_request
#    · error_page 401 y 403 -> @stream_denied
#    · access_log stream_safe en las TRES locations (las dos de stream y la
#      de denegación): si falta en una, el token acaba en el log por defecto
#    · los proxy_set_header son exactamente estos (ver nota de herencia abajo)
#
#  Nginx valida cada petición /stream/* contra FastAPI antes de proxyar a
#  Flussonic/Astra. El manifest lleva ?token= (validación completa + siembra un
#  grant en Redis); los segmentos sin token pasan solo si están cubiertos por un
#  grant vivo (mismo node + stream + IP de cliente).
# ─────────────────────────────────────────────────────────────────────────────

# Endpoint interno de autorización. `internal` => no alcanzable desde Internet,
# solo como subrequest de auth_request.
location = /__stream_auth {
    internal;
    # node + stream_key como query params (derivados por los maps de
    # 00-shared-http.conf); el token viaja en cabecera.
    #
    # Las $stream_* se capturan en la location /stream/* (fase rewrite) ANTES de
    # este subrequest: los subrequests comparten el array de variables `set` del
    # padre, a diferencia de $request_uri/$arg_token, que aquí se resolverían
    # contra ESTE subrequest (/__stream_auth) y llegarían vacíos.
    proxy_pass http://nexora_api:8000/internal/stream-auth/validate?node=$stream_node_v&stream_key=$stream_key_v;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Playback-Token $stream_token;
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-For  $remote_addr;
}

location ^~ /stream/ec-main/ {
    # Capturar URI original + token en variables compartidas ANTES del subrequest.
    set $stream_orig_uri $request_uri;
    set $stream_token $arg_token;
    auth_request /__stream_auth;
    error_page 401 = @stream_denied;
    error_page 403 = @stream_denied;
    access_log /dev/stdout stream_safe;

    proxy_pass http://181.78.246.211:8002/;          # Esmeraldas (Astra)
    proxy_http_version 1.1;
    # OJO: declarar proxy_set_header aquí ANULA los de snippets/proxy-common.conf
    # para esta location. Es deliberado: al origen de vídeo solo se le manda lo
    # imprescindible (y Host tiene que ser $proxy_host, no $host).
    proxy_set_header Host $proxy_host;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 60s;
    proxy_redirect off;
}

location ^~ /stream/co-main/ {
    set $stream_orig_uri $request_uri;
    set $stream_token $arg_token;
    auth_request /__stream_auth;
    error_page 401 = @stream_denied;
    error_page 403 = @stream_denied;
    access_log /dev/stdout stream_safe;

    proxy_pass http://38.210.187.13:8002/;           # Colombia
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 60s;
    proxy_redirect off;
}

# Canales transcodificados. A diferencia de ec-main/co-main, el origen NO es un
# Flussonic/Astra externo sino nuestros propios contenedores ffmpeg (ver
# docker-compose.transcode.production.yml y docs/PRUEBA_TRANSCODIFICACION.md).
# Mismo gate: el manifiesto exige ?token= y los segmentos pasan por el grant.
#
# ⚠ DEPENDENCIA DE ARRANQUE: `nexora_hls` es un nombre de contenedor y nginx
#   resuelve los upstream de proxy_pass al CARGAR la configuración, no por
#   petición. Si el stack de transcodificación está parado, nginx no arranca
#   ("host not found in upstream") y caen TODOS los dominios, no solo tc-main.
#   Esto ya era así en el conf monolítico de producción; al factorizarlo se
#   hereda igual. Para desacoplarlo haría falta `resolver` + proxy_pass con
#   variable, pero eso cambia el tratamiento del URI (la variable NO aplica el
#   recorte del prefijo que hace el `/` final) y exige un rewrite explícito.
#   No se toca aquí: es una ruta viva y merece su propia ventana.
location ^~ /stream/tc-main/ {
    set $stream_orig_uri $request_uri;
    set $stream_token $arg_token;
    auth_request /__stream_auth;
    error_page 401 = @stream_denied;
    error_page 403 = @stream_denied;
    access_log /dev/stdout stream_safe;

    proxy_pass http://nexora_hls:80/;                # contenedor sin puertos publicados
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 60s;
    proxy_redirect off;
}

# Torre de transcodificacion de Miami (66.163.125.89). Mismo gate, pero el origen
# esta al otro lado de internet y no en la red Docker: de ahi los timeouts
# explicitos. Su 8088 esta cerrado por firewall a todo salvo la IP de este edge.
#
# A diferencia de tc-main, aqui el upstream es una IP literal, asi que NO crea
# dependencia de arranque: nginx levanta aunque la torre este apagada.
location ^~ /stream/tc-mia/ {
    set $stream_orig_uri $request_uri;
    set $stream_token $arg_token;
    auth_request /__stream_auth;
    error_page 401 = @stream_denied;
    error_page 403 = @stream_denied;
    access_log /dev/stdout stream_safe;

    proxy_pass http://66.163.125.89:8088/;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout;
    proxy_redirect off;
}

location @stream_denied {
    access_log /dev/stdout stream_safe;
    default_type application/json;
    return 401 '{"success":false,"error":"playback token required or invalid"}';
}
