# Cabeceras de seguridad comunes a todos los vhosts HTTPS.
#
# HSTS (Strict-Transport-Security) NO está aquí: su max-age depende de la
# MADUREZ de cada dominio (un dominio recién dado de alta debe arrancar con un
# max-age corto para poder revertir sin dejar a los clientes clavados en HTTPS
# durante un año). Se declara en cada vhost. Ver README.md, "Escalera de HSTS".
#
# ⚠ nginx NO fusiona `add_header` entre niveles: si una location{} declara su
#   propio add_header, TODOS estos desaparecen para esa location. Si añades
#   add_header en alguna location, replica también estos.

add_header X-Frame-Options        "SAMEORIGIN"                    always;
add_header X-Content-Type-Options "nosniff"                       always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
