# ─────────────────────────────────────────────────────────────────────────────
#  CACHÉ DE SEGMENTOS HLS (P1.6) — ÚNICA COPIA.
#
#  Se incluye desde las CUATRO locations de nodo de snippets/stream-gate.conf
#  (ec-main, co-main, tc-main, tc-mia), que a su vez comparten los dos vhosts.
#  Misma doctrina que el gate: una sola copia. Si esto se duplicara por nodo, la
#  primera divergencia (una clave de caché distinta, un proxy_no_cache que falta)
#  sería un fallo de rendimiento o de aislamiento en un nodo y no en los otros —
#  exactamente el patrón que ya produjo el caso de tc-mia.
#
#  La zona `hls_cache`, su dimensionado y el map $stream_is_manifest viven en
#  conf.d/00-shared-http.conf (scope http{}), con la aritmética del tamaño.
#
#  ⚠ ESTE ARCHIVO NO CONTIENE NI RELAJA NINGUNA COMPROBACIÓN DE AUTORIZACIÓN.
#    Se incluye DESPUÉS de `auth_request` y no puede saltárselo: nginx resuelve
#    auth_request en la fase ACCESS y la caché en la fase CONTENT, y ACCESS va
#    siempre primero. Un token inválido da 401 aunque el segmento esté cacheado
#    y caliente (probado, ver runbook § 9).
# ─────────────────────────────────────────────────────────────────────────────

proxy_cache hls_cache;

# ── LA CLAVE NO LLEVA EL TOKEN ───────────────────────────────────────────────
# El valor por defecto de nginx es $scheme$proxy_host$request_uri, y
# $request_uri INCLUYE la query string: con el default, el ?token=... de cada
# espectador entraría en la clave, cada uno tendría su propia entrada, el acierto
# sería 0 % y habríamos añadido complejidad y disco para nada.
#
# $uri es el path normalizado SIN query string:  /stream/<nodo>/<stream>/<seg>.ts
# Es decir: la clave identifica el RECURSO, no a quién lo pide. Que dos peticiones
# con tokens distintos compartan entrada es el objetivo, no un efecto colateral —
# quién puede leerla lo decide el auth_request, que corre en cada petición.
#
# $proxy_host desambigua los cuatro orígenes. Es redundante con el <nodo> que ya
# va en $uri, y se deja a propósito: si algún día dos rutas distintas apuntaran
# al mismo path, la clave seguiría separándolas por origen.
#
# NO se incluye $host: los dos vhosts (nexoraplay.net y tvdigital.laredtelco.com)
# piden EXACTAMENTE los mismos bytes al MISMO origen. Compartir entrada entre
# marcas multiplica el acierto en vez de partirlo en dos. No hay fuga posible:
# el contenido de un .ts no depende del dominio por el que se pidió.
proxy_cache_key $proxy_host$uri;

# ── EL MANIFIESTO NO SE CACHEA ───────────────────────────────────────────────
# $stream_is_manifest vale 1 para .m3u8/.mpd (ver 00-shared-http.conf, donde está
# el razonamiento del TTL). bypass = no leer de caché; no_cache = no escribir.
# Hacen falta LOS DOS: solo con bypass, nginx seguiría guardando la respuesta y
# la serviría a la siguiente petición que no hiciera bypass.
proxy_cache_bypass $stream_is_manifest;
proxy_no_cache     $stream_is_manifest;

# ── TTL DE SEGMENTO: 30 s ────────────────────────────────────────────────────
# No es un número redondo elegido a ojo, es la ventana de directo del origen:
#   hls_time 4 s × hls_list_size 6 = 24 s de ventana publicada en el manifiesto.
# Dos espectadores del mismo canal pueden ir desfasados hasta esos 24 s (uno
# acaba de entrar y está en el borde, otro arrastra buffer), así que para que
# COMPARTAN entrada el TTL tiene que cubrir la ventana entera: TTL >= 24 s.
# 30 s = 24 s + un segmento y pico de margen para reintentos y rebuffering.
#
# Y no más, porque no sirve de nada: con `-hls_flags delete_segments` el origen
# borra el segmento en cuanto sale de la lista (~28 s de vida), y ningún cliente
# puede pedir un segmento que ya no aparece en ningún manifiesto. Un TTL de 5 min
# solo ocuparía 10× más disco reteniendo bytes que nadie va a volver a pedir.
proxy_cache_valid 200 30s;
# Un 404 del origen (segmento recién borrado, canal caído) se cachea 1 s para que
# un corte no se convierta en una tormenta de 404 contra la cabecera. 1 s es
# menos de un cuarto de segmento: no retrasa la recuperación de forma perceptible.
proxy_cache_valid 404 1s;

# ── COLAPSO DE PETICIONES CONCURRENTES ───────────────────────────────────────
# Ésta es la directiva que cumple el AC "N espectadores → 1 conexión al origen".
# Sin ella, la caché solo ayuda a partir de la SEGUNDA petición: N espectadores
# pidiendo el mismo segmento frío a la vez producirían N tiradas simultáneas al
# origen, que es justo el escenario que duele (todos ven el mismo partido).
# Con el lock, uno va al origen y los demás esperan a que llene la entrada.
proxy_cache_lock on;
proxy_cache_lock_age 5s;      # si el que fue al origen tarda >5 s, deja pasar a otro
proxy_cache_lock_timeout 10s; # tope de espera antes de ir al origen igualmente

# Mismo problema al EXPIRAR una entrada: `updating` deja que un solo request la
# revalide mientras el resto recibe la copia recién expirada, en lugar de
# amontonarse todos contra el origen en el mismo segundo.
# Deliberadamente NO se ponen `error timeout http_5xx`: servir vídeo rancio
# cuando el origen está caído enmascararía una caída de nodo, y P2.1 depende de
# poder detectarla.
proxy_cache_use_stale updating;

# ── SIN ESTO LA CACHÉ NO GUARDA NADA ─────────────────────────────────────────
# Los orígenes HLS (Astra, Flussonic y nuestro propio nginx de transcodificación)
# marcan los segmentos con `Cache-Control: no-cache`. Si nginx lo respeta, no
# almacena ni un byte y todo este archivo es decorativo. Los .ts son inmutables
# por definición del formato, así que ignorar esa cabecera es correcto.
#
# Set-Cookie NO se ignora, a propósito: si algún día un origen empezara a poner
# cookie, la respuesta simplemente no se cachearía (nginx se niega) en vez de
# repartir la cookie de un espectador a todos los demás. Fallo seguro por
# omisión, que es lo que se quiere en la ruta de autorización.
proxy_ignore_headers Cache-Control Expires X-Accel-Expires Vary;

# ── proxy_cache EXIGE proxy_buffering on ─────────────────────────────────────
# nginx solo puede escribir en caché lo que bufferiza; con `proxy_buffering off`
# la respuesta se pasa al cliente en streaming y NO se almacena. Esta línea
# ANULA a propósito el `proxy_buffering off` que las locations de nodo traían de
# antes. Es el único cambio de comportamiento de red del parche.
# 32 × 32k = 1 MiB en memoria, del orden del segmento de 1,5 MB: lo que no quepa
# va a un temporal en el propio directorio de caché (use_temp_path=off), así que
# el paso final sigue siendo un rename y no una copia entre sistemas de archivos.
proxy_buffering on;
proxy_buffers 32 32k;
proxy_busy_buffers_size 64k;

# NOTA sobre Range: las locations de nodo siguen reenviando Range/If-Range al
# origen. `proxy_cache_valid` NO lista 206 a propósito — cachear una respuesta
# parcial la almacenaría como si fuera el objeto completo. Con MISS + Range,
# nginx pide el rango, lo pasa al cliente y no lo guarda; con HIT, sirve el rango
# desde la copia completa que ya tiene. Correcto en los dos casos.
