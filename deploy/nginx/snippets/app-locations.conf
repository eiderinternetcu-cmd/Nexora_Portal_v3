# Rutas de aplicación comunes a todos los vhosts de marca: health, API y player.
# Se incluye a nivel de server{}, junto con snippets/stream-gate.conf.
#
# La API se proxya EN EL MISMO ORIGEN que el player a propósito: así las
# peticiones del player son same-origin y no dependen de la lista CORS del
# backend (app/main.py, _WEB_ORIGINS), que no incluye los dominios de
# producción. Cada marca nueva hereda esto sin tocar código.
#
# ⚠ NO se exponen /docs, /redoc ni /openapi.json. Ver README.md, sección
#   "Documentación de la API (/docs, /redoc, /openapi.json)".

location = /health {
    proxy_pass http://nexora_api:8000/health;
}

location = /api/health {
    proxy_pass http://nexora_api:8000/health;
}

location ^~ /api/ {
    proxy_pass http://nexora_api:8000;
}

# Todo lo demás: el web player (SPA).
location / {
    proxy_pass http://nexora_web_player:80;
}
