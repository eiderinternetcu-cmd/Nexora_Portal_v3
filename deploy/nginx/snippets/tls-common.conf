# Parámetros TLS comunes a todos los vhosts HTTPS.
# Se incluye DENTRO de server{}, después de los ssl_certificate/ssl_certificate_key
# (que son por dominio y viven en el vhost).
#
# NOTA: `listen 443 ssl http2;` está DEPRECADO desde nginx 1.25 (la imagen es
# 1.27). La forma correcta es `listen 443 ssl;` + `http2 on;` en el server{}.
# `http2 on` no se pone aquí a propósito: es una directiva de server, no de TLS,
# y se declara junto al listen para que se lea al lado de lo que afecta.

ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
