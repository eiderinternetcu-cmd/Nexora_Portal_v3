# Bloque para el nodo tc-mia (torre de Miami) en el nginx del edge.
#
# Copia versionada de lo que inserta patch_nginx_tc_mia.py en
# deploy/nginx/nexoraplay.conf, que hoy solo vive en el servidor (PR #9).
# Va ANTES del `location / {` que hace de catch-all hacia el web player.
#
# Depende de los `map` de $stream_node_v / $stream_key_v y de los locations
# /__stream_auth y @stream_denied, ya definidos en nexoraplay.conf.

location ^~ /stream/tc-mia/ {
    set $stream_orig_uri $request_uri;
    set $stream_token $arg_token;
    auth_request /__stream_auth;
    error_page 401 = @stream_denied;
    error_page 403 = @stream_denied;
    access_log /dev/stdout stream_safe;

    # Origen: 66.163.125.89:8088, cerrado por firewall a todo salvo este edge.
    # El video cruza internet, de ahi los timeouts explicitos.
    proxy_pass http://66.163.125.89:8088/;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout;
    proxy_redirect off;
}
