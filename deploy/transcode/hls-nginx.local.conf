# Servidor estatico de los segmentos HLS transcodificados.
# Solo para la prueba local: no lleva autorizacion — en produccion el canal
# transcodificado debe salir por el location /stream/ con auth_request.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # hls.js pide desde http://localhost:5173, otro origen distinto a este.
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;

    location / {
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t                    ts;
        }
        default_type application/octet-stream;

        # La lista se reescribe cada pocos segundos: cachearla rompe el directo.
        location ~ \.m3u8$ {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
        # Los segmentos son inmutables mientras existen.
        location ~ \.ts$ {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "public, max-age=30" always;
        }
    }

    location = /health {
        return 200 "ok\n";
        default_type text/plain;
    }
}
