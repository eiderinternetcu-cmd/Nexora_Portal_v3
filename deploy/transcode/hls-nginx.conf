# Servidor interno de los segmentos HLS transcodificados (nodo tc-main).
# NO publica puertos: solo lo alcanza nexora_nginx por la red interna, y este
# lo sirve bajo /stream/tc-main/ con auth_request. Sin token no hay video.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    autoindex off;

    location / {
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t                    ts;
        }
        default_type application/octet-stream;

        # La lista se reescribe cada pocos segundos: cachearla rompe el directo.
        location ~ \.m3u8$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
        location ~ \.ts$ {
            add_header Cache-Control "public, max-age=30" always;
        }
    }

    location = /health {
        return 200 "ok\n";
        default_type text/plain;
    }
}
