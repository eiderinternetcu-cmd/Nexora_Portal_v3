# Bloque que hay que tener en el nginx del edge para el nodo tc-main.
#
# NO es un fichero que nginx incluya por si solo: es la copia versionada de lo
# que `patch_nginx_tc.py` inserta en deploy/nginx/nexoraplay.conf, que hoy vive
# unicamente en el servidor (ver el PR #9 pendiente). Existe para que el bloque
# no se pierda si hay que rehacer el edge.
#
# Depende de dos cosas ya definidas en nexoraplay.conf:
#   - los `map` que sacan $stream_node_v y $stream_key_v de $stream_orig_uri
#   - los `location = /__stream_auth` y `location @stream_denied`
#
# Va ANTES del `location / {` que hace de catch-all hacia el web player.

location ^~ /stream/tc-main/ {
    set $stream_orig_uri $request_uri;
    set $stream_token $arg_token;
    auth_request /__stream_auth;
    error_page 401 = @stream_denied;
    error_page 403 = @stream_denied;
    access_log /dev/stdout stream_safe;

    # nexora_hls no publica puertos: sin este proxy no se alcanza desde fuera.
    proxy_pass http://nexora_hls:80/;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 60s;
    proxy_redirect off;
}
