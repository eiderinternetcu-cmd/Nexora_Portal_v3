version: "3.9"

services:
  api:
    build:
      context: .
      # dev-only stage (adds pytest/pytest-asyncio via requirements-dev.txt).
      # docker-compose.production.yml does not set `target`, so it falls back
      # to the Dockerfile's last stage (`runtime`, no dev deps) and never
      # picks this one up.
      target: dev
    container_name: nexora_api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Local/dev-only: lets `docker exec nexora_api python -m pytest tests/`
      # work out of the box. nexora_test is a dedicated DB, never the app one.
      - TEST_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-nexora}:${POSTGRES_PASSWORD:-nexora_secret}@postgres:5432/nexora_test
      - TEST_REDIS_URL=redis://redis:6379/15
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
      - ./alembic.ini:/app/alembic.ini
      # Dev-only: without this, pytest inside the container runs the copy
      # baked into the image at build time, not the files being edited.
      - ./tests:/app/tests
    networks:
      - nexora_net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: nexora_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora_secret}
    ports:
      - "5433:5432"
    volumes:
      - nexora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nexora_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nexora_redis
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6380:6379"
    volumes:
      - nexora_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nexora_net
    restart: unless-stopped

  web_player:
    build:
      context: ./web_player
      dockerfile: Dockerfile
    container_name: nexora_web_player
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - nexora_net
    restart: unless-stopped

volumes:
  nexora_pgdata:
  nexora_redisdata:

networks:
  nexora_net:
    driver: bridge
