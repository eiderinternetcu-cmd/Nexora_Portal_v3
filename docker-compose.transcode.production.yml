# Transcodificacion en produccion — nodo virtual "tc-main"
#
# Toma canales que el navegador NO puede reproducir y publica HLS H.264/AAC con
# GOP cerrado de 2 s (lo que exige Media Source Extensions). Ver
# docs/SOLUCIONES_PLAYBACK_NAVEGADOR.md y docs/PRUEBA_TRANSCODIFICACION.md.
#
# Stack SEPARADO a proposito: no toca docker-compose.production.yml. Se engancha
# a la red que ya existe, y se retira entero sin tocar el stack vivo:
#   Arrancar:  sudo docker compose -f docker-compose.transcode.production.yml up -d
#   Retirar:   sudo docker compose -f docker-compose.transcode.production.yml down
#
# La salida NO se expone a internet: no publica puertos. Solo la alcanza
# nexora_nginx, que la sirve bajo /stream/tc-main/ con su auth_request, igual
# que cualquier otro canal. Sin token no hay video.
#
# Coste medido en este Xeon E5620 (4 nucleos fisicos / 8 hilos):
#   GAMATV       SD MPEG-2 + bwdif           0,39
#   ECUADOR_TV   SD MPEG-2 (sin filtro)      0,33
#   RCN-COL      SD MPEG-2 + bwdif           0,39
#   CARACOL-COL  SD MPEG-2 + bwdif           0,37
#   WARNER       SD MPEG-2 + bwdif           0,54
#   GOLDEN_PLUS  1080i -> 720p + bwdif       2,14
#   ----------------------------------------------
#   total                                    ~4,2 de 8 hilos (51% CPU ociosa)
# Los limites `cpus` son la red de seguridad: pase lo que pase, no se comen la
# maquina que sirve la API.
#
# DESENTRELAZADO (2026-07-27). Medido con el filtro idet sobre las fuentes:
# GAMATV, RCN-COL, WARNER y GOLDEN_PLUS son entrelazados de verdad (293-303
# fotogramas TFF de 300); CARACOL-COL es mixto (180 TFF / 122 progresivos);
# ECUADOR_TV es PROGRESIVO pese a que el stream se declara `tt`, por eso NO
# lleva filtro — desentrelazarlo solo lo ablandaria.
#
# Se usa `bwdif=0` a secas y NO `idet,bwdif=deint=1`: el detector por fotograma
# costaba mas que el propio desentrelazado (GAMATV 65% contra 39%, RCN 77%
# contra 38%). En SD, bwdif sale practicamente gratis.

services:
  tc_gamatv:
    image: jrottenberg/ffmpeg:6.1-alpine
    container_name: nexora_tc_gamatv
    restart: unless-stopped
    cpus: 0.9
    networks: [nexora_net]
    volumes:
      - hls_data:/hls
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /hls/GAMATV &&
        exec ffmpeg -hide_banner -loglevel warning
        -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5
        -i http://181.78.246.211:8002/GAMATV/mpegts
        -vf bwdif=0
        -c:v libx264 -preset ultrafast -pix_fmt yuv420p
        -b:v 1500k -maxrate 1700k -bufsize 3000k
        -g 60 -keyint_min 60 -sc_threshold 0
        -c:a aac -b:a 128k -ac 2
        -f hls -hls_time 4 -hls_list_size 6
        -hls_flags delete_segments+append_list+omit_endlist
        -hls_segment_filename /hls/GAMATV/seg_%05d.ts
        /hls/GAMATV/index.m3u8

  tc_ecuadortv:
    image: jrottenberg/ffmpeg:6.1-alpine
    container_name: nexora_tc_ecuadortv
    restart: unless-stopped
    cpus: 0.9
    networks: [nexora_net]
    volumes:
      - hls_data:/hls
    entrypoint: ["/bin/sh", "-c"]
    # MPEG-2 720x480 desde el multicast de Astra (239.0.12.6), reparado el
    # 2026-07-27: apuntaba a una URL muerta con 223 reintentos. Mismo perfil
    # que GAMATV — SD sin escalar, ultrafast. Medido: 0,34 nucleos.
    command:
      - >-
        mkdir -p /hls/ECUADOR_TV &&
        exec ffmpeg -hide_banner -loglevel warning
        -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5
        -i http://181.78.246.211:8002/ECUADOR_TV/mpegts
        -c:v libx264 -preset ultrafast -pix_fmt yuv420p
        -b:v 1500k -maxrate 1700k -bufsize 3000k
        -g 60 -keyint_min 60 -sc_threshold 0
        -c:a aac -b:a 128k -ac 2
        -f hls -hls_time 4 -hls_list_size 6
        -hls_flags delete_segments+append_list+omit_endlist
        -hls_segment_filename /hls/ECUADOR_TV/seg_%05d.ts
        /hls/ECUADOR_TV/index.m3u8

  tc_rcn:
    image: jrottenberg/ffmpeg:6.1-alpine
    container_name: nexora_tc_rcn
    restart: unless-stopped
    cpus: 0.9
    networks: [nexora_net]
    volumes:
      - hls_data:/hls
    entrypoint: ["/bin/sh", "-c"]
    # MPEG-2 720x480 de satelite. Sus segmentos ya arrancan en keyframe, pero da
    # igual: el navegador no decodifica MPEG-2 (isTypeSupported('mp2v') = false).
    command:
      - >-
        mkdir -p /hls/RCN-COL &&
        exec ffmpeg -hide_banner -loglevel warning
        -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5
        -i http://181.78.246.211:8002/RCN-COL/mpegts
        -vf bwdif=0
        -c:v libx264 -preset ultrafast -pix_fmt yuv420p
        -b:v 1500k -maxrate 1700k -bufsize 3000k
        -g 60 -keyint_min 60 -sc_threshold 0
        -c:a aac -b:a 128k -ac 2
        -f hls -hls_time 4 -hls_list_size 6
        -hls_flags delete_segments+append_list+omit_endlist
        -hls_segment_filename /hls/RCN-COL/seg_%05d.ts
        /hls/RCN-COL/index.m3u8

  tc_caracol:
    image: jrottenberg/ffmpeg:6.1-alpine
    container_name: nexora_tc_caracol
    restart: unless-stopped
    cpus: 0.9
    networks: [nexora_net]
    volumes:
      - hls_data:/hls
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /hls/CARACOL-COL &&
        exec ffmpeg -hide_banner -loglevel warning
        -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5
        -i http://181.78.246.211:8002/CARACOL-COL/mpegts
        -vf bwdif=0
        -c:v libx264 -preset ultrafast -pix_fmt yuv420p
        -b:v 1500k -maxrate 1700k -bufsize 3000k
        -g 60 -keyint_min 60 -sc_threshold 0
        -c:a aac -b:a 128k -ac 2
        -f hls -hls_time 4 -hls_list_size 6
        -hls_flags delete_segments+append_list+omit_endlist
        -hls_segment_filename /hls/CARACOL-COL/seg_%05d.ts
        /hls/CARACOL-COL/index.m3u8

  tc_warner:
    image: jrottenberg/ffmpeg:6.1-alpine
    container_name: nexora_tc_warner
    restart: unless-stopped
    cpus: 0.9
    networks: [nexora_net]
    volumes:
      - hls_data:/hls
    entrypoint: ["/bin/sh", "-c"]
    # MPEG-2 720x480. El stream estaba muerto (apuntaba a un listener SRT vacio
    # del propio servidor, 320 reintentos) y se repunto al multicast de Astra
    # 239.0.0.16 el 2026-07-27.
    command:
      - >-
        mkdir -p /hls/WARNER &&
        exec ffmpeg -hide_banner -loglevel warning
        -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5
        -i http://181.78.246.211:8002/WARNER/mpegts
        -vf bwdif=0
        -c:v libx264 -preset ultrafast -pix_fmt yuv420p
        -b:v 1500k -maxrate 1700k -bufsize 3000k
        -g 60 -keyint_min 60 -sc_threshold 0
        -c:a aac -b:a 128k -ac 2
        -f hls -hls_time 4 -hls_list_size 6
        -hls_flags delete_segments+append_list+omit_endlist
        -hls_segment_filename /hls/WARNER/seg_%05d.ts
        /hls/WARNER/index.m3u8

  tc_golden:
    image: jrottenberg/ffmpeg:6.1-alpine
    container_name: nexora_tc_golden
    restart: unless-stopped
    cpus: 2.2
    networks: [nexora_net]
    volumes:
      - hls_data:/hls
    entrypoint: ["/bin/sh", "-c"]
    # 1080p -> 720p: escalar con veryfast costaba MAS que codificar a 1080p
    # (2,61 contra 2,36 nucleos), asi que aqui manda ultrafast.
    command:
      - >-
        mkdir -p /hls/GOLDEN_PLUS &&
        exec ffmpeg -hide_banner -loglevel warning
        -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5
        -i http://181.78.246.211:8002/GOLDEN_PLUS/mpegts
        -vf bwdif=0,scale=1280:720
        -c:v libx264 -preset ultrafast -pix_fmt yuv420p
        -b:v 2500k -maxrate 2800k -bufsize 5000k
        -g 60 -keyint_min 60 -sc_threshold 0
        -c:a aac -b:a 128k -ac 2
        -f hls -hls_time 4 -hls_list_size 6
        -hls_flags delete_segments+append_list+omit_endlist
        -hls_segment_filename /hls/GOLDEN_PLUS/seg_%05d.ts
        /hls/GOLDEN_PLUS/index.m3u8

  hls:
    image: nginx:1.27-alpine
    container_name: nexora_hls
    restart: unless-stopped
    networks: [nexora_net]
    volumes:
      - hls_data:/usr/share/nginx/html:ro
      - ./deploy/transcode/hls-nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  nexora_net:
    external: true
    name: nexora_api_nexora_net

volumes:
  hls_data:
